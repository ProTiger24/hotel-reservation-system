spring:
  application:
    name: hotel-booking
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_db
    username: hotel_user
    password: hotel_pass_2024
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Dhaka
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

jwt:
  secret: my-super-secret-key-for-jwt-signing-minimum-256-bits-long-please-change-this-key
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.yourhotel: DEBUG
    org.springframework.security: INFO
